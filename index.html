<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ilha da Turma</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a7fc0;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#topo{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;color:#fff;font-weight:700;text-shadow:0 1px 3px #000}
#rel{flex:1}
button{border:0;border-radius:12px;background:#fff;color:#222;font-size:15px;padding:8px 12px}
#zoom{position:fixed;right:10px;top:calc(58px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
#base{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
#info{color:#fff;font-size:13px;min-height:18px;padding:0 4px 5px}
#chips{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x}
#chips button{flex:none;font-size:13px;padding:6px 10px;border-radius:14px}
</style></head><body>
<canvas id="c"></canvas>
<div id="topo"><span id="rel"></span></div>
<div id="zoom"><button id="zm">＋</button><button id="zl">－</button></div>
<div id="base"><div id="info">Toque em um morador para acompanhar</div><div id="chips"></div></div>
<script>
/* =====================================================
   CONFIGURAÇÃO — 
   Medidas em "tiles" (1 tile = 16 pixels). x vai pra direita, y pra baixo.
   ===================================================== */
const MUNDO = {larg:80, alt:64};

const ESCOLA = {nome:"IFMT", x:29, y:24, larg:22, alt:7, img:"escola.png"};

// Casas e lojas. "dono" = nome do morador. cor = cor do telhado.
// Pra um personagem CONSTRUIR a casa: adicione  obra:{inicio:"2026-11-20T15:00", min:120}
// (ela vai subindo aos poucos e o dono fica lá construindo). Pra usar sua arte: img:"casa-ana.png"
const CONSTRUCOES = [
  
];

// Moradores. trabalho = "escola" ou o id de uma construção (ou null).
// sprite = seu desenho: "ana.png"  ou em camadas ["corpo.png","cabelo.png","roupa.png"]
// (sem sprite, aparece um bonequinho padrão da cor escolhida). Tamanho sugerido: 16x24 px.
const MORADORES = [
  
];

// Enfeites: tipo "arvore", "flor", "banco", "placa" (com texto) ou img:"arquivo.png"
const ENFEITES = [
  {tipo:"placa", x:38, y:34, texto:"Bem-vindos!"},
  {tipo:"banco", x:44, y:34},
  {tipo:"flor",  x:33, y:35, cor:"#ff6fa5"},
  {tipo:"flor",  x:34, y:36, cor:"#ffd166"},
];

/* =====================================================
   MOTOR — não precisa mexer daqui pra baixo
   ===================================================== */
const T=16, SLOT=20000;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const R=(g,c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=h;const g=c.getContext('2d');f(g,c.width,h);return c};
const img=s=>{const i=new Image();i.src=s;return i};
const hash=s=>{let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const CX=MUNDO.larg/2, CY=MUNDO.alt/2, RX=MUNDO.larg*.43, RY=MUNDO.alt*.42;
const nivel=(x,y)=>{const dx=(x-CX)/RX,dy=(y-CY)/RY,a=Math.atan2(dy,dx);return Math.hypot(dx,dy)/(1+.08*Math.sin(3*a+1)+.05*Math.sin(5*a+2)+.03*Math.sin(9*a))}; // <1 = terra

/* ---- construções ---- */
const TIPOS={casa:{w:4,h:4},loja:{w:5,h:4}};
const PORTAS={escola:{x:ESCOLA.x+ESCOLA.larg/2,y:ESCOLA.y+ESCOLA.alt+.6}};
const casaSpr=c=>mk(c.w*T,c.h*T,(g,w,h)=>{const rh=h/2;
  R(g,'#f3e6c8',4,rh,w-8,h-rh);R(g,'#cbb98c',4,h-4,w-8,4);
  for(let i=0;i<rh;i+=2){const k=Math.round((rh-i)*(w/2-2)/rh*.8);R(g,c.cor,k,i,w-2*k,2)}
  R(g,'rgba(0,0,0,.25)',2,rh-2,w-4,3);R(g,'#6b4423',w/2-5,h-16,10,16);R(g,'#ffd166',w/2+2,h-9,2,2);
  R(g,'#9bd7ff',9,rh+6,10,10);R(g,'#9bd7ff',w-19,rh+6,10,10)});
const lojaSpr=c=>mk(c.w*T,c.h*T,(g,w,h)=>{
  R(g,'#f6efe0',2,12,w-4,h-12);for(let x=0;x<w;x+=8)R(g,(x/8)%2?'#fff':c.cor,x,8,8,12);
  R(g,'rgba(0,0,0,.2)',0,20,w,2);R(g,'#6b4423',w/2-5,h-18,10,18);R(g,'#9bd7ff',8,26,14,12);R(g,'#9bd7ff',w-22,26,14,12);
  R(g,'#3b2410',w/2-22,0,44,8);g.fillStyle='#fff';g.font='bold 7px monospace';g.textAlign='center';g.fillText(c.nome||'',w/2,7)});
CONSTRUCOES.forEach(c=>{const t=TIPOS[c.tipo]||TIPOS.casa;c.w=c.w||t.w;c.h=c.h||t.h;
  c.porta={x:c.x+c.w/2,y:c.y+c.h+.6};PORTAS[c.id]=c.porta;
  c.spr=c.img?img(c.img):(c.tipo=='loja'?lojaSpr(c):casaSpr(c))});
const RETS=[...CONSTRUCOES.map(c=>({x:c.x,y:c.y,w:c.w,h:c.h})),{x:ESCOLA.x,y:ESCOLA.y-3,w:ESCOLA.larg,h:ESCOLA.alt+3}];
const bloq=(x,y,p=.3)=>RETS.some(r=>x>r.x-p&&x<r.x+r.w+p&&y>r.y-p&&y<r.y+r.h+p);
const prog=(c,t)=>{if(!c.obra)return 1;const i=new Date(c.obra.inicio).getTime();return Math.max(0,Math.min(1,(t-i)/(c.obra.min*60000)))};

/* ---- escola: um andar + "puxado" em cima ---- */
const esc=mk(ESCOLA.larg*T,(3+ESCOLA.alt)*T,(g,w,h)=>{
  const up=3*T,x0=w/2-5*T;
  R(g,'#f4f4ee',x0,8,10*T,up);R(g,'#2e7d32',x0-4,0,10*T+8,8);
  for(let i=0;i<5;i++){R(g,'#555',x0+11+i*30,19,20,22);R(g,'#7ec8f2',x0+12+i*30,20,18,20);R(g,'#555',x0+21+i*30,20,1,20)}
  R(g,'#2e7d32',0,up,w,8);R(g,'#f4f4ee',0,up+8,w,h-up-8);R(g,'#c9c9bf',0,h-6,w,6);
  for(let x=T;x<w-T;x+=T*2.2){if(Math.abs(x+8-w/2)<44)continue;R(g,'#555',x-1,up+16,18,24);R(g,'#7ec8f2',x,up+17,16,22)}
  R(g,'#555',w/2-T-2,h-36,2*T+4,36);R(g,'#7ec8f2',w/2-T,h-34,T-1,34);R(g,'#7ec8f2',w/2+1,h-34,T-1,34);
  R(g,'#c62828',w/2-26,up+14,52,16);g.fillStyle='#fff';g.font='bold 12px monospace';g.textAlign='center';g.fillText(ESCOLA.nome,w/2,up+27)});

/* ---- terreno (desenhado uma vez só) ---- */
const trilha=(a,b)=>{let x=Math.floor(a.x),y=Math.floor(a.y);const pt=()=>{if(!bloq(x+.5,y+.5,0)&&nivel(x+.5,y+.5)<.95)R(gt,'#d8b676',x*T,y*T,T,T)};
  while(x!=Math.floor(b.x)){x+=b.x>x?1:-1;pt()}while(y!=Math.floor(b.y)){y+=b.y>y?1:-1;pt()}};
let gt;
const terreno=mk(MUNDO.larg*T,MUNDO.alt*T,g=>{gt=g;
  for(let y=0;y<MUNDO.alt;y++)for(let x=0;x<MUNDO.larg;x++){
    const n=nivel(x+.5,y+.5),h=hash(x+','+y)%100;
    if(n>=1.12)continue;
    if(n>=1)R(g,'#58b5e0',x*T,y*T,T,T);
    else if(n>.9)R(g,h<15?'#dcc88a':'#e8d59a',x*T,y*T,T,T);
    else{R(g,h<20?'#52ad52':'#5cb85c',x*T,y*T,T,T);if(h<8)R(g,'#448f44',x*T+4,y*T+6,2,3)}}
  CONSTRUCOES.forEach(c=>trilha(PORTAS.escola,c.porta))});

/* ---- objetos fixos (ordenados por profundidade) ---- */
const FIXOS=[];
const arv=mk(24,32,g=>{R(g,'#6b4423',10,20,4,12);R(g,'#2a7a36',2,16,20,6);R(g,'#2e8b3e',2,6,20,12);R(g,'#3aa84c',5,2,14,12);R(g,'#7ccf6f',8,5,4,3)});
CONSTRUCOES.forEach(c=>FIXOS.push({y:(c.y+c.h)*T,d:(g,t)=>{
  const p=prog(c,t),s=c.spr,W=s.width,H=s.height;if(p<=0||!W)return;
  const b=(c.y+c.h)*T,top=b-H;g.drawImage(s,0,H*(1-p),W,H*p,c.x*T,top+H*(1-p),W,H*p);
  if(p<1){const y0=b-H*p-10;R(g,'#7a5230',c.x*T-2,y0,3,H*p+10);R(g,'#7a5230',c.x*T+W-1,y0,3,H*p+10);R(g,'#7a5230',c.x*T-2,y0,W+4,3)}}}));
const escImg=ESCOLA.img?img(ESCOLA.img):null;
FIXOS.push({y:(ESCOLA.y+ESCOLA.alt)*T,d:g=>{
  if(!escImg)g.drawImage(esc,ESCOLA.x*T,ESCOLA.y*T-3*T);
  else if(escImg.width)g.drawImage(escImg,ESCOLA.x*T,(ESCOLA.y+ESCOLA.alt)*T-escImg.height)}});
const sprEnf=e=>{
  if(e.img)return img(e.img);
  if(e.tipo=='arvore')return arv;
  if(e.tipo=='flor')return mk(8,8,g=>{R(g,'#3a8a3a',3,4,2,4);R(g,e.cor||'#ff6fa5',2,1,4,4);R(g,'#ffe066',3,2,2,2)});
  if(e.tipo=='banco')return mk(18,10,g=>{R(g,'#8a5a2b',0,0,18,2);R(g,'#8a5a2b',0,2,18,4);R(g,'#6b4423',1,6,2,4);R(g,'#6b4423',15,6,2,4)});
  if(e.tipo=='placa'){const w=Math.ceil((e.texto||'').length*4.4+8);return mk(w,16,g=>{R(g,'#6b4423',w/2-1,8,2,8);R(g,'#c89a5b',0,0,w,9);g.fillStyle='#3b2410';g.font='bold 7px monospace';g.fillText(e.texto||'',4,7)})}
  return arv};
ENFEITES.forEach(e=>{const s=sprEnf(e);FIXOS.push({y:e.y*T,d:g=>{if(s.width)g.drawImage(s,Math.round(e.x*T-s.width/2),Math.round(e.y*T-s.height))}})});
{const r=rng(42);let n=0;for(let i=0;i<500&&n<70;i++){
  const x=CX+(r()*2-1)*RX,y=CY+(r()*2-1)*RY;
  if(nivel(x,y)<.85&&!bloq(x,y,2.5)&&!Object.values(PORTAS).some(p=>Math.hypot(p.x-x,p.y-y)<2.5)){n++;FIXOS.push({y:y*T,d:g=>g.drawImage(arv,Math.round(x*T-12),Math.round(y*T-30))})}}}
const BRI=[];{const r=rng(7);for(let i=0;i<400&&BRI.length<120;i++){const x=r()*MUNDO.larg,y=r()*MUNDO.alt;if(nivel(x,y)>1.18)BRI.push({x:x*T,y:y*T,f:r()*9})}}

/* ---- rotina dos moradores (calculada pelo relógio: todo mundo vê igual) ---- */
const EST={dormir:['💤','dormindo'],casa:['☕','em casa, de manhã'],trabalho:['💼','trabalhando'],passeio:['🚶','passeando pela ilha'],almoco:['🍽️','almoçando'],lazer:['🌴','curtindo a ilha'],obra:['🔨','construindo a casa']};
const estado=(h,m)=>h>=22||h<6?'dormir':h<8?'casa':h<12?(m.trabalho?'trabalho':'passeio'):h<13?'almoco':h<17?(m.trabalho?'trabalho':'passeio'):'lazer';
const horaDe=t=>{const d=new Date(t);return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600};
function calcAlvo(m,s){
  const ts=s*SLOT,r=rng(hash(m.nome)+s*7919),casa=PORTAS[m.casa]||{x:CX,y:CY+8};
  let est=estado(horaDe(ts),m);
  const ob=CONSTRUCOES.find(c=>c.dono==m.nome&&c.obra&&prog(c,ts)>0&&prog(c,ts)<1);
  if(ob&&est!='dormir')est='obra';
  if(est=='dormir')return{...casa,est};
  const c=est=='trabalho'?(PORTAS[m.trabalho]||casa):est=='obra'?ob.porta:casa;
  const livre=est=='passeio'||est=='lazer'||est=='almoco';
  for(let i=0;i<40;i++){
    const x=livre?CX+(r()*2-1)*RX:c.x+(r()*2-1)*3.5,y=livre?CY+(r()*2-1)*RY:c.y+r()*3;
    if(nivel(x,y)<.88&&!bloq(x,y))return{x,y,est}}
  return{...c,est}}
function alvo(m,s){const k=m._c||(m._c={});if(k[s])return k[s];const v=calcAlvo(m,s);k[s]=v;const ks=Object.keys(k);if(ks.length>6)delete k[ks[0]];return v}
function pos(m,t){
  const s=Math.floor(t/SLOT),f=(t-s*SLOT)/SLOT,a=alvo(m,s-1),b=alvo(m,s);
  const p=Math.min(1,f/(.45+.4*(hash(m.nome+s)%100)/100));
  return{x:a.x+(b.x-a.x)*p,y:a.y+(b.y-a.y)*p,mov:p<1&&(a.x!=b.x||a.y!=b.y),dir:b.x<a.x?-1:1,est:b.est,sono:b.est=='dormir'&&p>=1}}
const pessoa=cor=>mk(16,24,g=>{R(g,'#4a2c1a',4,1,8,4);R(g,'#f1c27d',4,4,8,6);R(g,'#222',6,6,1,2);R(g,'#222',9,6,1,2);
  R(g,cor,3,10,10,8);R(g,'#f1c27d',1,10,2,6);R(g,'#f1c27d',13,10,2,6);R(g,'#3b4a6b',4,18,3,6);R(g,'#3b4a6b',9,18,3,6)});
MORADORES.forEach(m=>m.spr=m.sprite?[].concat(m.sprite).map(img):[pessoa(m.cor||'#e84393')]);

/* ---- tela, câmera e toque ---- */
let S=1,camX=CX*T,camY=(ESCOLA.y+3)*T,seg=null,desloc=0,dpr=1;
const agora=()=>Date.now()+desloc*3600000;
const ajusta=()=>{dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr};
addEventListener('resize',ajusta);ajusta();
const escuro=h=>h>=21||h<5?.55:h>=19?.55*(h-19)/2:h<7?.55*(7-h)/2:0;
const rel=document.getElementById('rel'),info=document.getElementById('info'),chips=document.getElementById('chips');
function frame(){
  const t=agora(),k=S*dpr,h=horaDe(t);
  if(seg){const P=pos(seg,t);camX+=(P.x*T-camX)*.1;camY+=(P.y*T-12-camY)*.1}
  camX=Math.max(0,Math.min(MUNDO.larg*T,camX));camY=Math.max(0,Math.min(MUNDO.alt*T,camY));
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#2a7fc0';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(k,0,0,k,cv.width/2-camX*k,cv.height/2-camY*k);
  ctx.fillStyle='rgba(255,255,255,.5)';for(const b of BRI)if(Math.sin(t/500+b.f)>.7)ctx.fillRect(b.x,b.y,3,1);
  ctx.drawImage(terreno,0,0);
  const L=FIXOS.map(f=>({y:f.y,d:()=>f.d(ctx,t)})),nomes=[];
  for(const m of MORADORES){
    const P=pos(m,t);
    if(P.sono){const d=PORTAS[m.casa];if(d)L.push({y:1e6,d:()=>{ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.fillText('Zzz',d.x*T-8,(d.y-3)*T-(t/300%8))}});continue}
    nomes.push({n:m.nome,x:P.x,y:P.y});
    L.push({y:P.y*T,d:()=>{const bob=P.mov?Math.abs(Math.sin(t/110))*1.5:0;
      ctx.save();ctx.translate(Math.round(P.x*T),Math.round(P.y*T-bob));if(P.dir<0)ctx.scale(-1,1);
      R(ctx,'rgba(0,0,0,.25)',-6,bob-1,12,3);for(const s of m.spr)if(s.width)ctx.drawImage(s,-Math.round(s.width/2),-s.height);ctx.restore()}})}
  L.sort((a,b)=>a.y-b.y).forEach(o=>o.d());
  ctx.setTransform(1,0,0,1,0,0);
  const a=escuro(h);if(a>0){ctx.fillStyle=`rgba(10,20,70,${a})`;ctx.fillRect(0,0,cv.width,cv.height)}
  ctx.font=`bold ${11*dpr}px system-ui`;ctx.textAlign='center';ctx.lineWidth=3*dpr;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.fillStyle='#fff';
  for(const o of nomes){const sx=cv.width/2+(o.x*T-camX)*k,sy=cv.height/2+(o.y*T-camY)*k-28*k;ctx.strokeText(o.n,sx,sy);ctx.fillText(o.n,sx,sy)}
  const d=new Date(t),tx=`🕒 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`+(desloc?` (teste +${desloc}h)`:'');
  if(rel.textContent!=tx)rel.textContent=tx;
  requestAnimationFrame(frame)}
const rotulo=m=>{const P=pos(m,agora());return EST[P.est][1]+(P.est=='trabalho'?` (${m.trabalho})`:'')};
function seguir(m){seg=m;if(S<1.5)S=2;info.textContent=m.nome+' — '+rotulo(m)}
MORADORES.forEach(m=>{const b=document.createElement('button');b.onclick=()=>seguir(m);chips.append(b);m.btn=b});
setInterval(()=>{const t=agora();MORADORES.forEach(m=>m.btn.textContent=EST[pos(m,t).est][0]+' '+m.nome);if(seg)info.textContent=seg.nome+' — '+rotulo(seg)},1000);

const ptr=new Map();let d0=0,moved=0;
const dist=()=>{const v=[...ptr.values()];return v.length==2?Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y):0};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;d0=dist()});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptr.size==1){camX-=dx/S;camY-=dy/S;if(moved>8)seg=null}
  else if(ptr.size==2){const d=dist();if(d0)S=Math.max(.4,Math.min(5,S*d/d0));d0=d}});
cv.addEventListener('pointerup',e=>{if(ptr.size==1&&moved<8)toca(e.clientX,e.clientY);ptr.delete(e.pointerId)});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{S=Math.max(.4,Math.min(5,S*(e.deltaY<0?1.15:.87)))});
function toca(x,y){const wx=(x-innerWidth/2)/S+camX,wy=(y-innerHeight/2)/S+camY,t=agora();
  for(const m of MORADORES){const P=pos(m,t);if(!P.sono&&Math.abs(wx-P.x*T)<12&&wy>P.y*T-28&&wy<P.y*T+4){seguir(m);return}}}
document.getElementById('zm').onclick=()=>S=Math.min(5,S*1.5);
document.getElementById('zl').onclick=()=>S=Math.max(.4,S/1.5);
frame();
</script></body></html>
